version: '3.8'

services:
  # 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: image-manager-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./backups:/app/backups
      - ./config.yaml:/app/config.yaml
    environment:
      - PYTHONPATH=/app
      - FLASK_ENV=production
    networks:
      - image-manager-network
    depends_on:
      - db

  # 前端服务
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: image-manager-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - image-manager-network

  # Nginx反向代理
  nginx:
    image: nginx:alpine
    container_name: image-manager-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - image-manager-network

  # 数据库服务（可选，如果需要MySQL）
  db:
    image: mysql:8.0
    container_name: image-manager-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: image_manager
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - image-manager-network
    command: --default-authentication-plugin=mysql_native_password

volumes:
  db_data:

networks:
  image-manager-network:
    driver: bridge
