services:
  # MySQL数据库服务
  db:
    image: mysql:8.0
    container_name: image-manager-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: image_manager
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - image-manager-network
    ports:
      - "3306:3306"

  # 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: image-manager-backend
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./backups:/app/backups
      - ./config.yaml:/app/config.yaml
      - ./run_backend.py:/app/run_backend.py
    environment:
      - PYTHONPATH=/app
      - FLASK_ENV=development
    networks:
      - image-manager-network

  # 前端服务
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: image-manager-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - image-manager-network

networks:
  image-manager-network:
    driver: bridge

volumes:
  mysql_data:
